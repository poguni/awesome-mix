<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>시안 B · Daylight Shelf</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&amp;family=Gothic+A1:wght@400;600;800&amp;family=Gaegu:wght@700&amp;family=Space+Mono:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F1EFEA}
a{color:#2B45E8}a:hover{color:#1A2DB0}
@keyframes dl-spin{to{transform:rotate(-360deg)}}
.dl-reel{animation:dl-spin 2s linear infinite}
button{font-family:inherit}
button:focus-visible,input:focus-visible{outline:3px solid #2B45E8;outline-offset:2px}
@media (prefers-reduced-motion:reduce){.dl-reel{animation:none}}
</style>
</head>
<body>
<div id="dc-root"></div>
<template id="dc-template">
<div style="min-height: 100vh; background: #F1EFEA; color: #17171C; font-family: 'Gothic A1', sans-serif; font-size: 15px; line-height: 1.55">
<div style="max-width: 1360px; margin: 0 auto; padding: 24px clamp(16px, 3vw, 40px) 56px; display: flex; flex-direction: column; gap: 28px">

<header style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 14px">
<div style="display: flex; align-items: center; gap: 28px; flex-wrap: wrap">
<div style="display: flex; align-items: center; gap: 10px">
<div aria-hidden="true" style="width: 38px; height: 26px; border-radius: 7px; background: #17171C; display: flex; align-items: center; justify-content: space-around; padding: 0 6px; box-sizing: border-box">
<div style="width: 8px; height: 8px; border-radius: 50%; background: {{accent}}"></div>
<div style="width: 8px; height: 8px; border-radius: 50%; background: #FFC53D"></div>
</div>
<span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 24px; letter-spacing: -0.02em">awesome mix</span>
</div>
<nav aria-label="주 메뉴" style="display: flex; gap: 4px; background: #E4E1D9; padding: 4px; border-radius: 999px">
<a href="#shelf" aria-current="page" style="height: 40px; padding: 0 16px; border-radius: 999px; background: #FFFFFF; color: #17171C; font-weight: 600; font-size: 14px; display: flex; align-items: center; text-decoration: none">선반</a>
<a href="#shelf" style="height: 40px; padding: 0 16px; border-radius: 999px; color: #4A4853; font-weight: 600; font-size: 14px; display: flex; align-items: center; text-decoration: none">라이브러리</a>
<a href="#curator" style="height: 40px; padding: 0 16px; border-radius: 999px; color: #4A4853; font-weight: 600; font-size: 14px; display: flex; align-items: center; text-decoration: none">AI 큐레이터</a>
</nav>
</div>
<div style="display: flex; align-items: center; gap: 10px">
<button type="button" style="height: 44px; padding: 0 20px; border-radius: 999px; border: none; background: #17171C; color: #FFFFFF; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px; cursor: pointer">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><path d="M12 11v5M9.5 13.5h5"></path></svg>
폴더 열기
</button>
<button type="button" aria-label="설정" style="width: 44px; height: 44px; border-radius: 50%; border: 1px solid #D3CFC5; background: #FFFFFF; color: #17171C; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"></path><circle cx="16" cy="7" r="2"></circle><circle cx="10" cy="17" r="2"></circle></svg>
</button>
</div>
</header>

<div style="display: flex; flex-wrap: wrap; gap: 32px; align-items: flex-start">

<div style="flex: 999 1 620px; min-width: 0; display: flex; flex-direction: column; gap: 28px">
<div style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px">
<h1 style="margin: 0; font-weight: 800; font-size: clamp(36px, 4.6vw, 60px); line-height: 1.08; letter-spacing: -0.03em">오늘은 어떤<br>테이프를 꽂을까요?</h1>
<div style="display: flex; gap: 8px; flex-wrap: wrap">
<span style="height: 34px; padding: 0 14px; border-radius: 999px; background: #FFFFFF; border: 1px solid #DDD9CF; font-size: 13px; font-weight: 600; display: flex; align-items: center">214곡</span>
<span style="height: 34px; padding: 0 14px; border-radius: 999px; background: #FFFFFF; border: 1px solid #DDD9CF; font-size: 13px; font-weight: 600; display: flex; align-items: center">테이프 5개</span>
<span style="height: 34px; padding: 0 14px; border-radius: 999px; background: #FFC53D; font-size: 13px; font-weight: 600; display: flex; align-items: center">AI가 만든 테이프 2개</span>
</div>
</div>

<section id="shelf" aria-label="테이프 선반" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 20px">
<sc-for list="{{tapes}}" as="tp" hint-placeholder-count="5">
<button type="button" onClick="{{tp.pick}}" aria-pressed="{{tp.pressed}}" style="text-align: left; border: none; border-radius: 22px; background: #FFFFFF; padding: 14px 14px 18px; display: flex; flex-direction: column; gap: 14px; cursor: pointer; transition: transform 0.2s ease, box-shadow 0.2s ease; {{tp.card}}">
<div style="position: relative; width: 100%; aspect-ratio: 16 / 10; border-radius: 12px; container-type: inline-size; {{tp.body}}">
<div style="position: absolute; left: 7%; right: 7%; top: 9%; height: 42%; background: #FFFFFF; border-radius: 2cqw; overflow: hidden">
<div style="height: 22%; {{tp.stripe}}"></div>
<div style="padding: 2.4cqw 5cqw 0; font-family: 'Gaegu', cursive; font-weight: 700; font-size: 8.4cqw; line-height: 1.05; color: #1F2D9E; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{tp.name}}</div>
</div>
<div aria-hidden="true" style="position: absolute; left: 26%; right: 26%; top: 60%; height: 22%; background: rgba(23,23,28,0.82); border-radius: 999px; display: flex; align-items: center; justify-content: space-between; padding: 0 3cqw">
<div style="width: 9cqw; height: 9cqw; border-radius: 50%; background: #FFFFFF; border: 1.4cqw solid #5A3A24; box-sizing: border-box"></div>
<div style="width: 9cqw; height: 9cqw; border-radius: 50%; background: #FFFFFF; border: 1.4cqw solid #5A3A24; box-sizing: border-box"></div>
</div>
<sc-if value="{{tp.ai}}" hint-placeholder-val="{{ false }}">
<span style="position: absolute; right: 4%; bottom: 6%; padding: 1cqw 3cqw; border-radius: 999px; background: #17171C; color: #FFC53D; font-family: 'Space Mono', monospace; font-weight: 700; font-size: 4.6cqw">AI</span>
</sc-if>
</div>
<div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; padding: 0 4px">
<div style="min-width: 0">
<div style="font-weight: 800; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{tp.name}}</div>
<div style="font-size: 13px; color: #5D5B66">{{tp.meta}}</div>
</div>
<sc-if value="{{tp.loaded}}" hint-placeholder-val="{{ false }}">
<span style="flex: none; height: 26px; padding: 0 10px; border-radius: 999px; background: #2B45E8; color: #FFFFFF; font-size: 12px; font-weight: 600; display: flex; align-items: center">재생 중</span>
</sc-if>
</div>
</button>
</sc-for>
<button type="button" style="min-height: 250px; border-radius: 22px; border: 2px dashed #C9C4B8; background: transparent; color: #4A4853; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; font-size: 15px; font-weight: 600; cursor: pointer">
<span aria-hidden="true" style="width: 48px; height: 48px; border-radius: 50%; background: #17171C; color: #FFFFFF; font-size: 26px; display: flex; align-items: center; justify-content: center">+</span>
새 테이프 만들기
</button>
</section>

<section id="curator" aria-label="AI 믹스테이프 큐레이터" style="background: #17171C; color: #FFFFFF; border-radius: 28px; padding: clamp(22px, 3vw, 36px); display: flex; flex-wrap: wrap; gap: 24px; align-items: center">
<div style="flex: 1 1 260px; min-width: 0">
<div style="font-family: 'Space Mono', monospace; font-size: 12px; color: #FFC53D; letter-spacing: 0.08em">AI CURATOR · OPENROUTER</div>
<h2 style="margin: 8px 0 6px; font-size: 28px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.2">말로 주문하는 믹스테이프</h2>
<p style="margin: 0; font-size: 14px; color: #BDBBC6">내 라이브러리에서만 곡을 골라 A면·B면을 짜 드려요. 음원은 PC 밖으로 나가지 않아요.</p>
</div>
<div style="flex: 999 1 420px; min-width: 0; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; gap: 10px; flex-wrap: wrap">
<label style="flex: 1 1 260px; display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: #BDBBC6">분위기나 상황
<input type="text" value="토요일 오후, 창문 열고 대청소" style="height: 54px; border-radius: 16px; border: 1px solid #3A3943; background: #24242B; color: #FFFFFF; padding: 0 18px; font-size: 16px; font-family: inherit">
</label>
<button type="button" style="flex: 0 0 auto; align-self: flex-end; height: 54px; padding: 0 24px; border-radius: 16px; border: none; background: {{accent}}; color: #1A0B02; font-size: 15px; font-weight: 800; cursor: pointer">믹스 만들기</button>
</div>
<div style="display: flex; gap: 8px; flex-wrap: wrap">
<button type="button" style="min-height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid #3A3943; background: transparent; color: #FFFFFF; font-size: 13px; cursor: pointer">비 오는 밤 드라이브</button>
<button type="button" style="min-height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid #3A3943; background: transparent; color: #FFFFFF; font-size: 13px; cursor: pointer">집중이 필요한 새벽</button>
<button type="button" style="min-height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid #3A3943; background: transparent; color: #FFFFFF; font-size: 13px; cursor: pointer">라이브러리 자동 분류</button>
</div>
</div>
</section>
</div>

<aside aria-label="워크맨 플레이어" style="flex: 1 1 360px; min-width: 0; max-width: 440px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px">
<div style="position: relative; padding-top: 44px">
<sc-if value="{{showPhones}}" hint-placeholder-val="{{ true }}">
<div aria-hidden="true" style="position: absolute; top: 0; left: 50%; width: 260px; height: 120px; margin-left: -130px; z-index: 1">
<div style="position: absolute; left: 34px; top: 0; width: 192px; height: 84px; border: 8px solid #B9BCC4; border-bottom: none; border-radius: 100px 100px 0 0; box-sizing: border-box"></div>
<div style="position: absolute; left: 0; top: 46px; width: 76px; height: 64px; border-radius: 50%; background-color: {{accent}}; background-image: radial-gradient(rgba(90,30,0,0.25) 1.3px, transparent 1.8px); background-size: 7px 7px; box-shadow: inset -7px -7px 0 rgba(0,0,0,0.14), 0 10px 18px rgba(23,23,28,0.25)"></div>
<div style="position: absolute; right: 0; top: 46px; width: 76px; height: 64px; border-radius: 50%; background-color: {{accent}}; background-image: radial-gradient(rgba(90,30,0,0.25) 1.3px, transparent 1.8px); background-size: 7px 7px; box-shadow: inset -7px -7px 0 rgba(0,0,0,0.14), 0 10px 18px rgba(23,23,28,0.25)"></div>
</div>
</sc-if>
<div style="position: relative; background: #2B45E8; color: #FFFFFF; border-radius: 40px; padding: 64px 22px 24px; display: flex; flex-direction: column; gap: 18px; box-shadow: 0 30px 60px rgba(43,69,232,0.28), inset 0 -6px 0 rgba(0,0,0,0.18)">
<div style="display: flex; justify-content: space-between; align-items: center; padding: 0 6px">
<span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 17px; letter-spacing: -0.01em">awesome mix</span>
<span style="font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.14em; color: #DCE1FF">STEREO · AM-86</span>
</div>

<div style="background: #1B2C9C; border-radius: 22px; padding: 14px; box-shadow: inset 0 4px 14px rgba(0,0,0,0.35)">
<div style="position: relative; width: 100%; aspect-ratio: 560 / 350; container-type: inline-size; background: #E3E6F2; border-radius: 4.5% / 7.2%; box-shadow: 0 8px 18px rgba(0,0,0,0.3)">
<div style="position: absolute; left: 6%; right: 6%; top: 6%; height: 30%; background: #FFFFFF; border-radius: 1.6cqw; overflow: hidden">
<div style="height: 20%; {{loadedStripe}}"></div>
<div style="display: flex; align-items: center; justify-content: space-between; padding: 1.8cqw 3.4cqw 0">
<div style="font-family: 'Gaegu', cursive; font-weight: 700; font-size: 6.6cqw; line-height: 1; color: #1F2D9E; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{tapeTitle}}</div>
<div style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 6cqw; color: #1F2D9E">{{side}}</div>
</div>
</div>
<div aria-hidden="true" style="position: absolute; left: 21%; right: 21%; top: 46%; height: 30%; background: rgba(23,23,28,0.12); border-radius: 2cqw"></div>
<div aria-hidden="true" style="position: absolute; border-radius: 50%; aspect-ratio: 1; background: repeating-radial-gradient(circle, #5A3A24 0 1.5px, #6B4730 1.5px 3px); {{leftPack}}"></div>
<div aria-hidden="true" style="position: absolute; border-radius: 50%; aspect-ratio: 1; background: repeating-radial-gradient(circle, #5A3A24 0 1.5px, #6B4730 1.5px 3px); {{rightPack}}"></div>
<svg class="dl-reel" aria-hidden="true" viewBox="0 0 52 52" style="position: absolute; left: 25.71%; top: 54%; width: 9.29%; {{leftSpin}}"><circle cx="26" cy="26" r="25" fill="#FFFFFF"></circle><circle cx="26" cy="26" r="11" fill="#2B45E8"></circle><path d="M26 15v-5M26 37v5M15 26h-5M37 26h5" stroke="#2B45E8" stroke-width="3.2" stroke-linecap="round"></path></svg>
<svg class="dl-reel" aria-hidden="true" viewBox="0 0 52 52" style="position: absolute; left: 65%; top: 54%; width: 9.29%; {{rightSpin}}"><circle cx="26" cy="26" r="25" fill="#FFFFFF"></circle><circle cx="26" cy="26" r="11" fill="#2B45E8"></circle><path d="M26 15v-5M26 37v5M15 26h-5M37 26h5" stroke="#2B45E8" stroke-width="3.2" stroke-linecap="round"></path></svg>
<div aria-hidden="true" style="position: absolute; left: 24%; right: 24%; bottom: 0; height: 13%; background: #CDD1E2; clip-path: polygon(7% 0, 93% 0, 100% 100%, 0 100%)"></div>
</div>
</div>

<div role="status" aria-live="polite" style="background: #D8F0C2; color: #173A12; border-radius: 16px; padding: 12px 16px; box-shadow: inset 0 2px 6px rgba(0,0,0,0.18)">
<div style="display: flex; justify-content: space-between; font-family: 'Space Mono', monospace; font-size: 12px; font-weight: 700"><span>{{lcdSide}}</span><span>{{lcdTime}}</span></div>
<div style="font-weight: 800; font-size: 19px; line-height: 1.3; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{lcdTitle}}</div>
<div style="font-size: 13px; color: #2F5A27">{{lcdArtist}}</div>
</div>

<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px">
<button type="button" onClick="{{rew}}" aria-label="되감기" style="height: 62px; border-radius: 16px; border: none; background: #EEF0F6; color: #17171C; box-shadow: 0 5px 0 #A9B0CC; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg aria-hidden="true" width="24" height="16" viewBox="0 0 26 18" fill="currentColor"><path d="M12 1 1 9l11 8zM25 1 14 9l11 8z"></path></svg>
</button>
<button type="button" onClick="{{play}}" aria-label="재생" aria-pressed="{{playPressed}}" style="height: 62px; border-radius: 16px; border: none; background: {{accent}}; color: #1A0B02; display: flex; align-items: center; justify-content: center; cursor: pointer; {{playKey}}">
<svg aria-hidden="true" width="18" height="20" viewBox="0 0 18 20" fill="currentColor"><path d="M1 1v18l16-9z"></path></svg>
</button>
<button type="button" onClick="{{stop}}" aria-label="정지, 한 번 더 누르면 꺼내기" style="height: 62px; border-radius: 16px; border: none; background: #EEF0F6; color: #17171C; display: flex; align-items: center; justify-content: center; cursor: pointer; {{stopKey}}">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 18 18" fill="currentColor"><rect x="1" y="1" width="16" height="16" rx="3"></rect></svg>
</button>
<button type="button" onClick="{{ff}}" aria-label="빨리 감기" style="height: 62px; border-radius: 16px; border: none; background: #EEF0F6; color: #17171C; box-shadow: 0 5px 0 #A9B0CC; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg aria-hidden="true" width="24" height="16" viewBox="0 0 26 18" fill="currentColor"><path d="M1 1l11 8-11 8zM14 1l11 8-11 8z"></path></svg>
</button>
</div>

<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
<button type="button" onClick="{{flip}}" aria-label="{{flipAria}}" style="height: 48px; border-radius: 14px; border: 1px solid #5C72F0; background: #1B2C9C; color: #FFFFFF; font-family: 'Space Mono', monospace; font-weight: 700; font-size: 13px; display: flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer">
<span style="{{sideAStyle}}">A</span><span aria-hidden="true">/</span><span style="{{sideBStyle}}">B</span>
</button>
<button type="button" onClick="{{toggleHiss}}" aria-pressed="{{hissPressed}}" style="height: 48px; border-radius: 14px; border: 1px solid #5C72F0; font-family: 'Space Mono', monospace; font-weight: 700; font-size: 12px; letter-spacing: 0.08em; cursor: pointer; {{hissStyle}}">HISS</button>
<button type="button" onClick="{{toggleWow}}" aria-pressed="{{wowPressed}}" style="height: 48px; border-radius: 14px; border: 1px solid #5C72F0; font-family: 'Space Mono', monospace; font-weight: 700; font-size: 12px; letter-spacing: 0.08em; cursor: pointer; {{wowStyle}}">WOW</button>
</div>
</div>
</div>

<section aria-label="지금 테이프의 곡 목록" style="background: #FFFFFF; border-radius: 24px; padding: 20px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; justify-content: space-between; align-items: baseline; gap: 10px">
<h2 style="margin: 0; font-size: 17px; font-weight: 800">{{sideHeading}}</h2>
<span style="font-family: 'Space Mono', monospace; font-size: 12px; color: #5D5B66">{{capText}}</span>
</div>
<ol style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px">
<sc-for list="{{tracks}}" as="t" hint-placeholder-count="6">
<li>
<button type="button" onClick="{{t.pick}}" style="width: 100%; min-height: 48px; border: none; border-radius: 12px; padding: 6px 10px; display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; gap: 10px; align-items: center; text-align: left; cursor: pointer; {{t.row}}">
<span style="font-family: 'Space Mono', monospace; font-size: 12px">{{t.n}}</span>
<span style="min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis"><b style="font-weight: 800">{{t.title}}</b> <span style="font-size: 13px; {{t.sub}}">· {{t.artist}}</span></span>
<span style="font-family: 'Space Mono', monospace; font-size: 12px">{{t.d}}</span>
</button>
</li>
</sc-for>
</ol>
</section>
</aside>
</div>

</div>
</div>
</template>

<script>
/* .dc.html 템플릿을 브라우저에서 그리는 최소 런타임 */
class DCLogic {
  constructor(props) { this.props = props || {}; this.state = {}; }
  setState(patch) {
    const p = typeof patch === 'function' ? patch(this.state, this.props) : patch;
    this.state = Object.assign({}, this.state, p);
    window.__dcRender();
  }
  forceUpdate() { window.__dcRender(); }
}
</script>
<script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { playing: true, side: 'A', hiss: true, wow: true, cur: 1, tape: 0 };
  }
  renderVals() {
    const s = this.state;
    const accent = this.props.accent ?? '#FF6A1F';
    const tapes = [
      { name: 'Awesome Mix Vol. 1', body: accent, stripe: '#2B45E8', meta: 'C60 · 13곡 · 52분', ai: false },
      { name: '토요일 대청소', body: '#FFC53D', stripe: accent, meta: 'C60 · 12곡 · 49분 · AI', ai: true },
      { name: 'Night Drive', body: '#17171C', stripe: '#FFC53D', meta: 'C90 · 19곡 · 84분', ai: false },
      { name: 'Sunday Coffee', body: '#2FBF9B', stripe: '#FFFFFF', meta: 'C46 · 10곡 · 41분', ai: false },
      { name: '새벽 집중 모드', body: '#8F7CFF', stripe: '#17171C', meta: 'C60 · 14곡 · 57분 · AI', ai: true }
    ];
    const sides = {
      A: [
        { t: 'Neon Harbor', a: 'The Velvet Static', d: '3:52' },
        { t: 'Paper Planets', a: 'Juno & The Tides', d: '4:11' },
        { t: 'Slow Motion Summer', a: 'Coastline Radio', d: '3:38' },
        { t: 'Magnetic Heart', a: 'Lila Mercer', d: '4:05' },
        { t: 'Ride the Static', a: 'Northbound', d: '3:47' },
        { t: 'Afterglow Avenue', a: 'Mono Bloom', d: '4:26' }
      ],
      B: [
        { t: 'Cloudbreak', a: 'Ivory Lane', d: '3:58' },
        { t: 'Satellite Sunday', a: 'Polaroid Kids', d: '3:41' },
        { t: 'Velvet Engine', a: 'Marlowe Grey', d: '4:19' },
        { t: 'Moonlit Freeway', a: 'Sundial', d: '4:33' },
        { t: 'Little Wild Things', a: 'Hazel & Rome', d: '3:25' },
        { t: 'Fade Out Slowly', a: 'Echo Park Choir', d: '5:02' }
      ]
    };
    const list = sides[s.side];
    const sec = (d) => { const p = d.split(':'); return Number(p[0]) * 60 + Number(p[1]); };
    const fmt = (t) => Math.floor(t / 60) + ':' + String(Math.floor(t % 60)).padStart(2, '0');
    const total = list.reduce((a, t) => a + sec(t.d), 0);
    const cur = Math.min(s.cur, list.length - 1);
    const elapsed = list.slice(0, cur).reduce((a, t) => a + sec(t.d), 0) + 96;
    const p = Math.min(1, elapsed / total);
    const hub = 26, max = 80;
    const rL = Math.sqrt(hub * hub + (1 - p) * (max * max - hub * hub));
    const rR = Math.sqrt(hub * hub + p * (max * max - hub * hub));
    const pack = (cx, r) => 'left:' + ((cx - r) / 560 * 100).toFixed(2) + '%;top:' + ((215 - r) / 350 * 100).toFixed(2) + '%;width:' + (2 * r / 560 * 100).toFixed(2) + '%;';
    const spin = (r) => 'animation-duration:' + (r / hub * 1.3).toFixed(2) + 's;animation-play-state:' + (s.playing ? 'running' : 'paused') + ';';
    const toggle = (on) => on ? 'background:#FFC53D;color:#17171C;' : 'background:#1B2C9C;color:#DCE1FF;';
    const tape = tapes[s.tape];
    return {
      accent,
      showPhones: this.props.showPhones ?? true,
      side: s.side,
      tapeTitle: tape.name,
      loadedStripe: 'background:' + tape.body + ';',
      leftPack: pack(170, rL),
      rightPack: pack(390, rR),
      leftSpin: spin(rL),
      rightSpin: spin(rR),
      lcdSide: 'SIDE ' + s.side + ' · ' + String(cur + 1).padStart(2, '0') + (s.playing ? ' ▶' : ' ■'),
      lcdTime: fmt(elapsed) + ' / ' + fmt(total),
      lcdTitle: list[cur].t,
      lcdArtist: list[cur].a,
      playPressed: String(s.playing),
      playKey: s.playing ? 'transform:translateY(5px);box-shadow:0 0 0 #000;' : 'box-shadow:0 5px 0 #B54A12;',
      stopKey: s.playing ? 'box-shadow:0 5px 0 #A9B0CC;' : 'transform:translateY(5px);box-shadow:0 0 0 #000;',
      flipAria: s.side === 'A' ? '지금 A면, B면으로 뒤집기' : '지금 B면, A면으로 뒤집기',
      sideAStyle: s.side === 'A' ? 'color:#FFC53D;' : 'color:#8E9BEA;',
      sideBStyle: s.side === 'B' ? 'color:#FFC53D;' : 'color:#8E9BEA;',
      hissStyle: toggle(s.hiss),
      wowStyle: toggle(s.wow),
      hissPressed: String(s.hiss),
      wowPressed: String(s.wow),
      sideHeading: tape.name + ' · ' + s.side + '면',
      capText: fmt(total) + ' / 30:00',
      tracks: list.map((t, i) => ({
        n: String(i + 1).padStart(2, '0'),
        title: t.t,
        artist: t.a,
        d: t.d,
        row: i === cur ? 'background:#2B45E8;color:#FFFFFF;' : 'background:transparent;color:#17171C;',
        sub: i === cur ? 'color:#DCE1FF;' : 'color:#5D5B66;',
        pick: () => this.setState({ cur: i, playing: true })
      })),
      tapes: tapes.map((x, i) => ({
        name: x.name,
        meta: x.meta,
        ai: x.ai,
        loaded: i === s.tape,
        pressed: String(i === s.tape),
        body: 'background:' + x.body + ';',
        stripe: 'background:' + x.stripe + ';',
        card: i === s.tape ? 'transform:translateY(-6px);box-shadow:0 0 0 3px #2B45E8, 0 18px 30px rgba(23,23,28,0.12);' : 'box-shadow:0 1px 0 #DDD9CF;',
        pick: () => this.setState({ tape: i, cur: 0, side: 'A', playing: true })
      })),
      play: () => this.setState({ playing: true }),
      stop: () => this.setState({ playing: false }),
      rew: () => this.setState({ cur: Math.max(0, cur - 1) }),
      ff: () => this.setState({ cur: Math.min(list.length - 1, cur + 1) }),
      flip: () => this.setState({ side: s.side === 'A' ? 'B' : 'A', cur: 0 }),
      toggleHiss: () => this.setState({ hiss: !s.hiss }),
      toggleWow: () => this.setState({ wow: !s.wow })
    };
  }
}
</script>

<script>
(() => {
  const HOLE = /\{\{\s*([^}]+?)\s*\}\}/g;
  const WHOLE = /^\s*\{\{\s*([^}]+?)\s*\}\}\s*$/;
  const resolve = (path, scope) => {
    path = path.trim();
    if (path === 'true') return true;
    if (path === 'false') return false;
    if (/^-?\d/.test(path)) return Number(path);
    if (/^['"]/.test(path)) return path.slice(1, -1);
    return path.split('.').reduce((o, k) => (o == null ? undefined : o[k]), scope);
  };
  const text = (s, scope) => s.replace(HOLE, (_, p) => { const v = resolve(p, scope); return v == null ? '' : String(v); });
  const attrValue = (raw, scope) => { const m = WHOLE.exec(raw); return m ? resolve(m[1], scope) : text(raw, scope); };

  const renderChildren = (src, scope, out) => { for (const n of src.childNodes) renderNode(n, scope, out); };
  const renderNode = (n, scope, out) => {
    if (n.nodeType === Node.TEXT_NODE) { out.appendChild(document.createTextNode(text(n.nodeValue, scope))); return; }
    if (n.nodeType !== Node.ELEMENT_NODE) return;
    const tag = n.localName;
    if (tag === 'sc-for') {
      const list = attrValue(n.getAttribute('list') || '', scope) || [];
      const as = n.getAttribute('as') || 'item';
      list.forEach((item, i) => renderChildren(n, Object.assign(Object.create(scope), { [as]: item, $index: i }), out));
      return;
    }
    if (tag === 'sc-if') {
      if (attrValue(n.getAttribute('value') || '', scope)) renderChildren(n, scope, out);
      return;
    }
    const el = document.createElementNS(n.namespaceURI, n.localName);
    for (const a of n.attributes) {
      if (a.name.startsWith('hint-')) continue;
      const v = attrValue(a.value, scope);
      if (a.name.startsWith('on') && typeof v === 'function') { el.addEventListener(a.name.slice(2), v); continue; }
      if (v === false || v == null) continue;
      el.setAttribute(a.name, v === true ? '' : String(v));
    }
    renderChildren(n, scope, el);
    out.appendChild(el);
  };

  const tpl = document.getElementById('dc-template').content;
  const root = document.getElementById('dc-root');
  const comp = new Component({"accent": "#FF6A1F", "showPhones": true});
  window.__dcRender = () => {
    const frag = document.createDocumentFragment();
    renderChildren(tpl, comp.renderVals(), frag);
    root.replaceChildren(frag);
  };
  window.__dcRender();
  if (comp.componentDidMount) comp.componentDidMount();
})();
</script>
